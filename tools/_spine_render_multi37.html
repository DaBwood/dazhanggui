<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="spine-webgl-3.7.js"></script>
<script>
(async function () {
  try {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const type = params.get('type') || 'patrons';
    const fmt = params.get('fmt') || 'bin';
    const W = parseInt(params.get('w') || '1400', 10);
    const H = parseInt(params.get('h') || '1800', 10);
    const base = `stage/${type}/${id}/`;
    const dataFile = fmt === 'json' ? 'skeleton.json' : 'skeleton.bin';

    const stamp = '?v=' + Date.now();
    const atlasText = await fetch(base + 'skeleton.atlas' + stamp, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('atlas ' + r.status);
      return r.text();
    });

    // Page names are the unindented lines immediately followed by an
    // unindented "size:" line.  Region names are followed by indented
    // properties, so they never match.
    const lines = atlasText.split(/\r?\n/);
    const pageNames = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line || /^\s/.test(line) || line.indexOf(':') >= 0) continue;
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && !/^\s/.test(lines[j]) && /^size:/.test(lines[j].trim())) {
        pageNames.push(line.trim());
      }
    }
    if (!pageNames.length) throw new Error('no atlas pages');

    const images = await Promise.all(pageNames.map(name => new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('texture load failed: ' + name));
      img.src = base + name + stamp;
    })));
    const imageByPage = {};
    pageNames.forEach((name, i) => { imageByPage[name] = images[i]; });

    const dataBuf = await fetch(base + dataFile + stamp, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error(dataFile + ' ' + r.status);
      return fmt === 'json' ? r.text() : r.arrayBuffer();
    });

    const canvas = document.getElementById('c');
    canvas.width = W;
    canvas.height = H;
    const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: true });
    if (!gl) throw new Error('no webgl');

    const atlas = new spine.TextureAtlas(atlasText, function (path) {
      const key = path.split('/').pop();
      const img = imageByPage[path] || imageByPage[key] || images[0];
      if (!img) throw new Error('no texture for ' + path);
      return new spine.webgl.GLTexture(gl, img);
    });
    const loader = new spine.AtlasAttachmentLoader(atlas);
    let data;
    if (fmt === 'json') {
      data = new spine.SkeletonJson(loader).readSkeletonData(JSON.parse(dataBuf));
    } else {
      data = new spine.SkeletonBinary(loader).readSkeletonData(new Uint8Array(dataBuf));
    }
    const skeleton = new spine.Skeleton(data);
    skeleton.setToSetupPose();
    const hide = (params.get('hide') || '').split(',').filter(Boolean);
    const noBlend = params.get('noblend') === '1';
    const hideExact = new Set(hide.filter(h => /^\d+$/.test(h)));
    const hideSub = hide.filter(h => !hideExact.has(h));
    // hidex hides exact slot names: automated passes hit slots whose names end
    // in digits, where substring matching would also drop siblings.
    const hideX = new Set((params.get('hidex') || '').split(',').filter(Boolean));
    if (hide.length || noBlend || hideX.size) {
      for (const slot of skeleton.slots) {
        const name = slot.data.name;
        if (hideX.has(name) || hideExact.has(name) || hideSub.some(h => name.indexOf(h) >= 0)) {
          skeleton.setAttachment(name, null);
        } else if (noBlend && slot.data.blendMode !== 0) {
          skeleton.setAttachment(name, null);
        }
      }
    }
    const anim = params.get('anim');
    if (anim) {
      const state = new spine.AnimationState(new spine.AnimationStateData(data));
      state.setAnimation(0, anim, false);
      const atRaw = params.get('time') || '0';
      let at = parseFloat(atRaw);
      if (atRaw === 'end') {
        const clip = data.findAnimation ? data.findAnimation(anim) : null;
        at = clip ? Math.max(0, clip.duration - 0.05) : 0;
      }
      state.update(at);
      state.apply(skeleton);
    }
    skeleton.updateWorldTransform();

    // Attachment page/quad are only needed by the dump branch: they let a
    // caller map rendered pixels back to the slot that drew them.
    function pageNameOf(att) {
      try {
        const ro = att && att.rendererObject;
        if (ro && ro.page && ro.page.name) return ro.page.name;
        if (ro && ro.name) return ro.name;
      } catch (e) { /* not an atlas attachment */ }
      return '';
    }
    function worldQuadOf(att, slot) {
      if (!att || !att.computeWorldVertices) return null;
      try {
        if (att instanceof spine.RegionAttachment) {
          const v = new Float32Array(8);
          att.computeWorldVertices(slot.bone, v, 0, 2);
          return Array.from(v);
        }
        const n = att.worldVerticesLength || 0;
        if (!n) return null;
        const v = new Float32Array(n);
        att.computeWorldVertices(slot, 0, n, v, 0, 2);
        return Array.from(v);
      } catch (e) {
        return null;
      }
    }

    if (params.get('dump')) {
      const info = skeleton.slots.map(slot => {
        const att = slot.getAttachment();
        return {
          name: slot.data.name,
          bone: slot.bone.data.name,
          blend: slot.data.blendMode,
          color: [slot.color.r, slot.color.g, slot.color.b, slot.color.a],
          attachment: att ? att.name : '',
          page: pageNameOf(att),
          quad: worldQuadOf(att, slot),
          x: Math.round(slot.bone.worldX * 10) / 10,
          y: Math.round(slot.bone.worldY * 10) / 10,
        };
      });
      const bones = skeleton.bones.map(bone => ({
        name: bone.data.name,
        parent: bone.parent ? bone.parent.data.name : '',
        x: Math.round(bone.worldX * 10) / 10,
        y: Math.round(bone.worldY * 10) / 10,
      }));
      const animations = (data.animations || []).map(a => ({ name: a.name, duration: a.duration }));
      const bo = new spine.Vector2();
      const bs = new spine.Vector2();
      skeleton.getBounds(bo, bs, []);
      const meta = { bounds: { x: bo.x, y: bo.y, w: bs.x, h: bs.y }, canvas: { w: W, h: H } };
      document.body.innerHTML = '<pre id="dump">' + JSON.stringify({slots: info, bones: bones, animations: animations, meta: meta}) + '</pre>';
      document.title = 'DUMP';
      window.__done = true;
      return;
    }

    const offset = new spine.Vector2();
    const size = new spine.Vector2();
    skeleton.getBounds(offset, size, []);
    if (!(size.x > 0 && size.y > 0)) throw new Error('empty bounds');

    const pad = Math.max(size.x, size.y) * 0.03;
    const worldW = size.x + pad * 2;
    const worldH = size.y + pad * 2;
    const scale = Math.min(W / worldW, H / worldH);
    const viewW = W / scale;
    const viewH = H / scale;

    const renderer = new spine.webgl.SceneRenderer(canvas, gl, true);
    const camera = new spine.webgl.OrthoCamera(canvas.width, canvas.height);
    camera.viewportWidth = viewW;
    camera.viewportHeight = viewH;
    camera.position.set(offset.x + size.x / 2, offset.y + size.y / 2, 0);
    camera.update();
    renderer.camera = camera;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // Atlas pages are straight (non-premultiplied) alpha.  Scene-style skins
    // with large soft-alpha areas need pma=0, otherwise those areas show up as
    // washed-out rectangles.
    const pma = params.get('pma') !== '0';
    renderer.begin();
    renderer.drawSkeleton(skeleton, pma);
    renderer.end();

    document.title = 'OK ' + canvas.width + 'x' + canvas.height + ' ' + offset.x + ',' + offset.y + ',' + size.x + ',' + size.y + ' ' + viewW + ',' + viewH;
    window.__done = true;
  } catch (e) {
    document.title = 'ERR ' + e.message;
    window.__error = e.message;
  }
})();
</script>
</body>
</html>
